<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌈 Braulio Clicker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: 'Impact', 'Arial Black', sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
      background: #0a0a0a;
      color: #fff;
    }

    canvas#bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 1rem;
      max-width: 700px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .coin-display {
      font-size: clamp(2rem, 6vw, 3.5rem);
      color: #ffd700;
      text-shadow: 0 0 20px #ffd700, 0 0 40px #ffd70088;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .coin-display small { font-size: 0.4em; color: rgba(255,255,255,0.4); }

    .title {
      font-size: clamp(2.2rem, 7vw, 5rem);
      line-height: 1.1;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      animation: pulse 1.5s ease-in-out infinite;
      text-shadow: 0 0 20px currentColor, 0 0 40px currentColor, 0 0 80px currentColor;
      margin: 0.5rem 0;
    }

    .subtitle {
      font-size: clamp(0.9rem, 2.5vw, 1.3rem);
      color: #fff;
      opacity: 0.6;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }

    .click-btn {
      margin: 0.8rem 0;
      padding: 0.8rem 2.5rem;
      border: 3px solid #fff;
      border-radius: 50px;
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.2s;
      background: rgba(255,255,255,0.05);
      font-family: inherit;
      letter-spacing: 0.1em;
    }
    .click-btn:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(255,255,255,0.2); }
    .click-btn:active { transform: scale(0.92); }

    .shop-header {
      font-size: 0.9rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      opacity: 0.5;
      margin: 0.5rem 0 0.3rem;
    }

    .shop-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      width: 100%;
      max-width: 500px;
    }

    .upgrade-card {
      background: rgba(255,255,255,0.04);
      border: 2px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 0.6rem 0.4rem;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(4px);
      user-select: none;
    }
    .upgrade-card:hover:not(.owned):not(.locked) { border-color: rgba(255,255,255,0.35); transform: translateY(-2px); }
    .upgrade-card:active:not(.owned):not(.locked) { transform: scale(0.95); }
    .upgrade-card.owned { border-color: rgba(255,215,0,0.25); background: rgba(255,215,0,0.05); cursor: default; }
    .upgrade-card.owned::after { content: '✅'; position: absolute; top: 3px; right: 5px; font-size: 0.7rem; }
    .upgrade-card.locked { opacity: 0.3; cursor: not-allowed; filter: grayscale(0.6); }
    .upgrade-card.locked .upgrade-cost { color: #ff4444; }
    .upgrade-emoji { font-size: 1.6rem; display: block; margin-bottom: 0.1rem; }
    .upgrade-name { font-size: 0.65rem; letter-spacing: 0.03em; opacity: 0.85; line-height: 1.2; }
    .upgrade-cost { font-size: 0.75rem; color: #ffd700; }
    .upgrade-rate { font-size: 0.6rem; opacity: 0.4; }

    .status-bar {
      display: flex;
      justify-content: center;
      gap: 2rem;
      font-size: 0.75rem;
      opacity: 0.4;
      letter-spacing: 0.1em;
      margin: 0.5rem 0;
    }

    /* ── Game Scene (bottom-right, 30% x 30%, no interact) ── */
    .game-wrapper {
      position: fixed;
      bottom: 10px;
      right: 10px;
      width: min(30vw, 400px);
      height: min(30vh, 250px);
      z-index: 5;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,0.08);
      pointer-events: none;
      opacity: 0.9;
    }
    .game-wrapper canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .unicorn-container {
      position: fixed;
      bottom: -80px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      font-size: 5rem;
      pointer-events: none;
    }
    .unicorn-container.jump { animation: unicornJump 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    .unicorn-container.jump-super { animation: unicornSuperJump 1s cubic-bezier(0.22, 1.9, 0.36, 1) forwards; }
    @keyframes unicornJump {
      0% { bottom: -80px; transform: translateX(-50%) scale(1) rotate(0deg); }
      30% { bottom: 150px; transform: translateX(-50%) scale(1.3) rotate(-10deg); }
      50% { bottom: 180px; transform: translateX(-50%) scale(1.4) rotate(5deg); }
      70% { bottom: 80px; transform: translateX(-50%) scale(1.1) rotate(-3deg); }
      100% { bottom: -80px; transform: translateX(-50%) scale(1) rotate(0deg); }
    }
    @keyframes unicornSuperJump {
      0% { bottom: -80px; transform: translateX(-50%) scale(1) rotate(0deg); }
      25% { bottom: 250px; transform: translateX(-50%) scale(1.6) rotate(-15deg); }
      45% { bottom: 300px; transform: translateX(-50%) scale(1.8) rotate(10deg); }
      65% { bottom: 120px; transform: translateX(-50%) scale(1.2) rotate(-5deg); }
      85% { bottom: 20px; transform: translateX(-50%) scale(1.05) rotate(2deg); }
      100% { bottom: -80px; transform: translateX(-50%) scale(1) rotate(0deg); }
    }

    .confetti-piece {
      position: fixed;
      width: 8px; height: 8px;
      top: -15px;
      border-radius: 2px;
      animation: fall linear forwards;
      z-index: 5;
    }
    @keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: 0; } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }

    .coin-popup {
      position: fixed;
      pointer-events: none;
      font-size: 1rem;
      color: #ffd700;
      font-weight: bold;
      z-index: 25;
      animation: coinFloat 1s ease-out forwards;
      text-shadow: 0 0 10px #ffd700;
    }
    @keyframes coinFloat { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-50px) scale(1.3); } }

    .level-up-flash {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 30;
      pointer-events: none;
      animation: flashAnim 0.6s ease-out forwards;
    }
    @keyframes flashAnim { 0% { background: radial-gradient(circle, rgba(255,215,0,0.35) 0%, transparent 70%); opacity: 1; } 100% { opacity: 0; } }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>

  <div class="container">
    <div class="coin-display">
      <span>🪙</span>
      <span id="coin-amount">0</span>
      <small id="coin-rate">(+0/s)</small>
    </div>

    <div class="title" id="main-title">BRAULIO<br>ES<br>MARICO</div>
    <div class="subtitle">🌈 Click pa ganar 🪙</div>

    <button class="click-btn" id="btn">🎉 +1 🪙</button>

    <div class="shop-header">🏪 MEJORAS PRIDE 🏪</div>
    <div class="shop-grid" id="shop"></div>

    <div class="status-bar">
      <span id="total-clicks">total: 0</span>
      <span id="owned-count">mejoras: 0/7</span>
    </div>
  </div>

  <div class="game-wrapper" id="gameWrapper">
    <canvas id="gameCanvas"></canvas>
  </div>

  <div class="unicorn-container" id="unicorn">🦄</div>

  <script>
    // ═══════════════════════════════════════════════════════════════════════════
    // CONFIG
    // ═══════════════════════════════════════════════════════════════════════════
    const COLORS = ['#ff0055','#ff6b00','#ffe600','#00ff88','#00cfff','#bf00ff','#ff00cc','#00ffee'];

    const LEVELS = [
      { coins: 0,     title: 'BRAULIO<br>ES<br>MARICO',        laugh: 0 },
      { coins: 100,   title: '¡BRAULIO ES<br>SÚPER MARICO!',   laugh: 1 },
      { coins: 1000,  title: '¡EL MÁS MARICO<br>DEL MUNDO!',   laugh: 2 },
      { coins: 10000, title: '🏆 BRAULIO<br>CAMPEÓN 🏆',       laugh: 3 },
      { coins: 100000,title: '✨ MARICO<br>LEGENDARIO ✨',      laugh: 4 },
    ];

    const UPGRADES = [
      { id: 'flag',    emoji: '🏳️\u200d🌈', name: 'Bandera\nArcoíris',    cost: 10,     rate: 0.5,   color: '#ff0055', weapon: 'wave' },
      { id: 'wand',    emoji: '✨',          name: 'Varita\nMágica',       cost: 50,    rate: 2,    color: '#ff6b00', weapon: 'star' },
      { id: 'uni',     emoji: '🦄',          name: 'Unicornio\nArcoíris',  cost: 200,   rate: 8,    color: '#ffe600', weapon: 'beam' },
      { id: 'diamond', emoji: '💎',          name: 'Diamante\nPride',      cost: 1000,  rate: 32,   color: '#00ff88', weapon: 'bolt' },
      { id: 'star',    emoji: '🌟',          name: 'Estrella\nBrillante',  cost: 5000,  rate: 128,  color: '#00cfff', weapon: 'sparkle' },
      { id: 'crown',   emoji: '👑',          name: 'Corona\nDrag',         cost: 25000, rate: 512,  color: '#bf00ff', weapon: 'rainbow' },
      { id: 'legend',  emoji: '🔥',          name: 'Arcoíris Legendario',  cost: 100000,rate: 2048, color: '#ff00cc', weapon: 'nova', big: true },
    ];

    // ═══════════════════════════════════════════════════════════════════════════
    // STATE
    // ═══════════════════════════════════════════════════════════════════════════
    let coins = 0, totalCoins = 0, clickPower = 1, owned = {}, audioCtx = null;
    const coinEl = document.getElementById('coin-amount');
    const rateEl = document.getElementById('coin-rate');
    const titleEl = document.getElementById('main-title');
    const btn = document.getElementById('btn');
    const shop = document.getElementById('shop');
    const totalClicksEl = document.getElementById('total-clicks');
    const ownedCountEl = document.getElementById('owned-count');
    const unicorn = document.getElementById('unicorn');

    // ═══════════════════════════════════════════════════════════════════════════
    // BACKGROUND CANVAS
    // ═══════════════════════════════════════════════════════════════════════════
    const bgCanvas = document.getElementById('bg');
    const bgCtx = bgCanvas.getContext('2d');
    let W, H, particles = [];
    function resizeBg() { W = bgCanvas.width = window.innerWidth; H = bgCanvas.height = window.innerHeight; }
    class Particle {
      constructor() { this.reset(true); }
      reset(init) { this.x=Math.random()*W; this.y=init?Math.random()*H:H+10; this.r=Math.random()*3+1; this.color=COLORS[Math.floor(Math.random()*COLORS.length)]; this.speed=Math.random()*0.8+0.3; this.dx=(Math.random()-0.5)*0.5; this.alpha=Math.random()*0.7+0.3; }
      update() { this.y-=this.speed; this.x+=this.dx; if(this.y<-10) this.reset(); }
      draw() { bgCtx.save(); bgCtx.globalAlpha=this.alpha; bgCtx.fillStyle=this.color; bgCtx.shadowBlur=8; bgCtx.shadowColor=this.color; bgCtx.beginPath(); bgCtx.arc(this.x,this.y,this.r,0,Math.PI*2); bgCtx.fill(); bgCtx.restore(); }
    }
    function initParticles() { particles = Array.from({length:80},()=>new Particle()); }

    // ═══════════════════════════════════════════════════════════════════════════
    // AUDIO
    // ═══════════════════════════════════════════════════════════════════════════
    function getCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playClick() {
      const ctx = getCtx(), t = ctx.currentTime;
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = 'square'; osc.frequency.setValueAtTime(1200, t); osc.frequency.exponentialRampToValueAtTime(400, t + 0.08);
      gain.gain.setValueAtTime(0.15, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
      osc.connect(gain); gain.connect(ctx.destination); osc.start(t); osc.stop(t + 0.1);
    }

    function playBuy() {
      const ctx = getCtx(), t = ctx.currentTime;
      [800, 1000, 1200].forEach((freq, i) => {
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.type = 'square'; osc.frequency.setValueAtTime(freq, t + i * 0.06);
        gain.gain.setValueAtTime(0.12, t + i * 0.06); gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.06 + 0.1);
        osc.connect(gain); gain.connect(ctx.destination); osc.start(t + i * 0.06); osc.stop(t + i * 0.06 + 0.1);
      });
    }

    function playLaugh(level) {
      const ctx = getCtx(), now = ctx.currentTime;
      const intensity = 0.3 + level * 0.12, notes = [600, 700, 650, 800, 750, 900, 850, 1000];
      const count = Math.min(4 + level * 2, notes.length);
      for (let i = 0; i < count; i++) {
        const t = now + i * 0.1;
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(notes[i], t);
        osc.frequency.exponentialRampToValueAtTime(notes[i]*1.4, t+0.04); osc.frequency.exponentialRampToValueAtTime(notes[i]*0.7, t+0.08);
        gain.gain.setValueAtTime(intensity, t); gain.gain.exponentialRampToValueAtTime(0.001, t+0.12);
        osc.connect(gain); gain.connect(ctx.destination); osc.start(t); osc.stop(t+0.12);
      }
    }

    function playHit() {
      const ctx = getCtx(), t = ctx.currentTime;
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = 'square'; osc.frequency.setValueAtTime(200, t); osc.frequency.exponentialRampToValueAtTime(50, t+0.12);
      gain.gain.setValueAtTime(0.2, t); gain.gain.exponentialRampToValueAtTime(0.001, t+0.12);
      osc.connect(gain); gain.connect(ctx.destination); osc.start(t); osc.stop(t+0.12);
    }

    function playBossHit() {
      const ctx = getCtx(), t = ctx.currentTime;
      [80,60,40].forEach((freq,i) => {
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(freq, t+i*0.15);
        gain.gain.setValueAtTime(0.25, t+i*0.15); gain.gain.exponentialRampToValueAtTime(0.001, t+i*0.15+0.2);
        osc.connect(gain); gain.connect(ctx.destination); osc.start(t+i*0.15); osc.stop(t+i*0.15+0.2);
      });
    }

    // ── 8-bit Music Engine ──────────────────────────────────────────────────
    const BPM = 128, BEAT_MS = 60000 / BPM;
    const TRACKS = {
      flag: { wave: 'square', vol: 0.06, notes: [[0,130.81],[1,164.81],[2,196],[3,130.81],[4,164.81],[5,196],[6,220],[7,261.63]] },
      wand: { wave: 'square', vol: 0.04, notes: [[0,523.25],[0.5,587.33],[1,659.25],[1.5,783.99],[2,880],[2.5,783.99],[3,659.25],[3.5,587.33],[4,523.25],[4.5,659.25],[5,783.99],[5.5,880],[6,1046.5],[6.5,880],[7,783.99],[7.5,659.25]] },
      uni: { wave: 'triangle', vol: 0.05, notes: [[0,261.63],[2,329.63],[4,392],[6,523.25],[0,329.63],[2,392],[4,523.25],[6,659.25],[0,392],[2,493.88],[4,587.33],[6,783.99]] },
      diamond: { wave: 'square', vol: 0.03, notes: (()=>{const n=[];for(let b=0;b<8;b+=0.25)n.push([b,523.25+Math.random()*800]);return n;})() },
      star: { wave: 'square', vol: 0.04, notes: [[0,1046.5],[0.5,1174.7],[1,1318.5],[1.5,1174.7],[2,1396.9],[2.5,1318.5],[3,1174.7],[3.5,1046.5],[4,783.99],[4.5,880],[5,1046.5],[5.5,1174.7],[6,1318.5],[6.5,1396.9],[7,1568],[7.5,1760]] },
      crown: { wave: 'sawtooth', vol: 0.02, notes: (()=>{const n=[];for(let b=0;b<8;b+=0.25)if(Math.random()>0.3)n.push([b,200+Math.random()*800]);return n;})() },
      legend: { wave: 'square', vol: 0.04, notes: [[0,784],[0.5,1046.5],[1,1174.7],[1.5,1318.5],[2,1396.9],[2.5,1568],[3,1760],[3.5,1975.5],[4,1760],[4.5,1568],[5,1396.9],[5.5,1318.5],[6,1174.7],[6.5,1046.5],[7,880],[7.5,783.99]] },
    };
    let musicPlaying = false, musicTimer = null, beatCount = 0;

    function startMusic() {
      if (musicPlaying) return;
      musicPlaying = true;
      beatCount = 0;
      const ctx = getCtx();
      function schedule() {
        if (!musicPlaying) return;
        const now = ctx.currentTime, la = now + 0.1;
        const ownedIds = Object.keys(owned).filter(id=>owned[id]);
        ownedIds.forEach(id => {
          const track = TRACKS[id]; if (!track) return;
          const beatWin = beatCount % 8;
          track.notes.forEach(([b, freq]) => {
            const nb = Math.floor(b);
            if (Math.abs(nb - beatWin) < 0.01 || Math.abs(nb+8 - beatWin) < 0.01) {
              const st = la + (b - nb) * BEAT_MS / 1000;
              const osc = ctx.createOscillator(), gain = ctx.createGain();
              osc.type = track.wave; osc.frequency.setValueAtTime(freq, st);
              gain.gain.setValueAtTime(track.vol, st); gain.gain.exponentialRampToValueAtTime(0.001, st + 0.08);
              osc.connect(gain); gain.connect(ctx.destination); osc.start(st); osc.stop(st + 0.08);
            }
          });
        });
        beatCount++;
        musicTimer = setTimeout(schedule, BEAT_MS);
      }
      schedule();
    }

    function stopMusic() { musicPlaying = false; if (musicTimer) { clearTimeout(musicTimer); musicTimer = null; } }

    function updateMusic() {
      const count = Object.keys(owned).filter(id=>owned[id]).length;
      if (count > 0) startMusic(); else stopMusic();
    }

    // ═══════════════════════════════════════════════════════════════════════════
    // GAME LOGIC
    // ═══════════════════════════════════════════════════════════════════════════
    function formatNum(n) {
      if (n >= 1e6) return (n/1e6).toFixed(1)+'M';
      if (n >= 1e3) return (n/1e3).toFixed(1)+'K';
      return Math.floor(n).toString();
    }

    function getCurrentLevel() {
      for (let i = LEVELS.length-1; i >= 0; i--) if (totalCoins >= LEVELS[i].coins) return i;
      return 0;
    }

    function updateUI() {
      coinEl.textContent = formatNum(coins);
      const r = Object.keys(owned).reduce((s,id)=>owned[id]?s+UPGRADES.find(u=>u.id===id).rate:s,0);
      rateEl.textContent = `(+${formatNum(r)}/s)`;
      totalClicksEl.textContent = `total: ${formatNum(totalCoins)}`;
      ownedCountEl.textContent = `mejoras: ${Object.keys(owned).filter(k=>owned[k]).length}/${UPGRADES.length}`;
    }

    function checkLevelUp() {
      const lv = getCurrentLevel();
      if (lv > 0 && LEVELS[lv].title !== titleEl.innerHTML) {
        titleEl.innerHTML = LEVELS[lv].title;
        playLaugh(LEVELS[lv].laugh);
        unicornJump(lv >= 3);
        launchConfetti(100);
        const flash = document.createElement('div');
        flash.className = 'level-up-flash';
        document.body.appendChild(flash);
        setTimeout(()=>flash.remove(), 600);
      }
    }

    function addCoins(amount) { coins += amount; totalCoins += amount; updateUI(); checkLevelUp(); }

    function coinPopup(x, y, text) {
      const el = document.createElement('div');
      el.className = 'coin-popup'; el.textContent = '+'+text;
      el.style.left = x+'px'; el.style.top = y+'px';
      document.body.appendChild(el);
      setTimeout(()=>el.remove(), 1000);
    }

    btn.addEventListener('click', (e) => {
      getCtx(); addCoins(clickPower); playClick(); launchConfetti(5);
      coinPopup(e.clientX, e.clientY, clickPower); updateShop();
    });

    let autoInterval = setInterval(() => {
      const r = Object.keys(owned).reduce((s,id)=>owned[id]?s+UPGRADES.find(u=>u.id===id).rate:s,0);
      if (r > 0) addCoins(r / 10);
    }, 100);

    // ── Shop ──────────────────────────────────────────────────────────────────
    function renderShop() {
      shop.innerHTML = '';
      UPGRADES.forEach((upg, idx) => {
        const card = document.createElement('div');
        card.className = 'upgrade-card';
        if (upg.big) card.classList.add('big-card');
        card.dataset.id = upg.id;
        card.innerHTML = `
          <span class="upgrade-emoji">${upg.emoji}</span>
          <div class="upgrade-info">
            <div class="upgrade-name">${upg.name.replace(/\n/g, '<br>')}</div>
            <div class="upgrade-cost">🪙 ${formatNum(upg.cost)}</div>
            <div class="upgrade-rate">+${upg.rate}/s</div>
          </div>
        `;
        card.addEventListener('click', ()=>buyUpgrade(upg.id));
        shop.appendChild(card);
      });
      updateShop();
    }

    function updateShop() {
      shop.querySelectorAll('.upgrade-card').forEach((card, idx) => {
        const upg = UPGRADES[idx];
        const isOwned = owned[upg.id];
        const prevOwned = idx === 0 || owned[UPGRADES[idx-1].id];
        card.classList.remove('owned', 'locked');
        if (isOwned) card.classList.add('owned');
        else if (!prevOwned || coins < upg.cost) card.classList.add('locked');
      });
    }

    function buyUpgrade(id) {
      const upg = UPGRADES.find(u=>u.id===id);
      if (!upg || owned[id]) return;
      const idx = UPGRADES.indexOf(upg);
      if (idx > 0 && !owned[UPGRADES[idx-1].id]) return;
      if (coins < upg.cost) return;
      coins -= upg.cost; owned[id] = true;
      playBuy(); launchConfetti(40);
      unicornJump(false);
      coinPopup(window.innerWidth/2-30, window.innerHeight/2-30, upg.rate+'/s');
      updateUI(); updateShop(); updateMusic();
      if (Object.keys(owned).filter(k=>owned[k]).length === UPGRADES.length) {
        titleEl.innerHTML = '🌈 MEGA MARICO<br>LEGENDARIO 🌈';
        launchConfetti(300); unicornJump(true);
        setTimeout(()=>launchConfetti(200), 1000);
      }
    }

    function launchConfetti(n=30) {
      for (let i=0; i<n; i++) {
        const el = document.createElement('div');
        el.className = 'confetti-piece';
        el.style.left = Math.random()*100+'vw';
        el.style.background = COLORS[Math.floor(Math.random()*COLORS.length)];
        el.style.width = (Math.random()*10+4)+'px'; el.style.height = (Math.random()*10+4)+'px';
        el.style.borderRadius = Math.random()>0.5?'50%':'2px';
        const dur = (Math.random()*2+1.5).toFixed(2);
        el.style.animationDuration = dur+'s';
        document.body.appendChild(el);
        setTimeout(()=>el.remove(), dur*1000);
      }
    }

    function unicornJump(superJump) {
      unicorn.classList.remove('jump','jump-super');
      void unicorn.offsetWidth;
      unicorn.classList.add(superJump?'jump-super':'jump');
    }

    let colorIndex = 0;
    function cycleColor() { titleEl.style.color = COLORS[colorIndex%COLORS.length]; colorIndex++; }
    cycleColor(); setInterval(cycleColor, 600);

    function bgAnimate() {
      bgCtx.clearRect(0,0,W,H);
      particles.forEach(p=>{p.update();p.draw();});
      requestAnimationFrame(bgAnimate);
    }
    resizeBg(); initParticles(); bgAnimate();
    window.addEventListener('resize', ()=>{resizeBg();initParticles();});

    // ═══════════════════════════════════════════════════════════════════════════
    // 8-BIT SIDE-SCROLLING GAME (bottom-right, 30% x 30%)
    // ═══════════════════════════════════════════════════════════════════════════
    const gc = document.getElementById('gameCanvas');
    const gx = gc.getContext('2d');
    let gw, gh;

    function resizeGame() {
      const wrapper = document.getElementById('gameWrapper');
      const rect = wrapper.getBoundingClientRect();
      gw = gc.width = Math.floor(rect.width * 2);
      gh = gc.height = Math.floor(rect.height * 2);
    }
    window.addEventListener('resize', resizeGame);
    resizeGame();

    // ── Terrain ──────────────────────────────────────────────────────────────
    const TERRAINS = [
      { id:'grassland', sky:['#4a90d9','#87ceeb'], ground:['#3a7d3a','#2d6b2d','#5a9e5a'], name:'🌿 Prado'},
      { id:'city',      sky:['#2a2a3e','#4a4a6e'], ground:['#555','#666','#777'],       name:'🏙️ Ciudad'},
      { id:'forest',    sky:['#1a3a2a','#2a5a3a'], ground:['#2a4a2a','#1a3a1a','#3a5a3a'], name:'🌲 Bosque'},
      { id:'swamp',     sky:['#2a1a3a','#4a2a5a'], ground:['#3a2a2a','#4a3a3a','#5a3a4a'], name:'🌫️ Pantano'},
      { id:'volcano',   sky:['#2a0a0a','#5a1a0a'], ground:['#3a1a0a','#4a2a0a','#5a3a0a'], name:'🌋 Volcán'},
      { id:'space',     sky:['#0a0a2a','#1a0a3a'], ground:['#1a1a2a','#2a1a3a','#3a1a4a'], name:'✨ Espacio'},
    ];

    function getTerrain() { return TERRAINS[Math.floor(totalCoins/500) % TERRAINS.length]; }

    // ── Game objects ─────────────────────────────────────────────────────────
    const game = {
      scrollX: 0, players: [], enemies: [], projectiles: [], particles: [],
      enemyTimer: 0, bossTimer: 600+Math.random()*300, bossActive: false,
      frame: 0, screenShake: 0, killCount: 0,
    };

    class GamePlayer {
      constructor(upg, index) {
        this.upg = upg; this.index = index;
        this.emoji = upg.emoji;
        this.x = 20 + index * 26; this.y = 0; this.w = 20; this.h = 22;
        this.anim = 0; this.animT = 0; this.cooldown = 0;
        this.bob = Math.random() * Math.PI * 2;
      }
      update() {
        this.bob += 0.08;
        this.animT++; if(this.animT>8){this.animT=0;this.anim^=1;}
        this.cooldown--;
        if (this.cooldown <= 0) {
          this.cooldown = 25 + this.index * 4;
          game.projectiles.push(new Projectile(this.x+this.w-2, this.y+8, this.upg));
        }
      }
      draw() {
        const y = gh - 54 + Math.sin(this.bob) * 2; this.y = y;
        gx.font = '18px monospace';
        gx.textAlign = 'center';
        gx.textBaseline = 'bottom';
        gx.fillStyle = '#fff';
        gx.shadowBlur = 12;
        gx.shadowColor = this.upg.color;
        gx.fillText(this.emoji, this.x + this.w/2, y + this.h + 2);
        gx.shadowBlur = 0;
      }
    }

    class Projectile {
      constructor(x, y, upg) {
        this.x=x; this.y=y; this.upg=upg;
        this.w=6; this.h=3; this.speed=4; this.alive=true;
      }
      update() { this.x+=this.speed; if(this.x>gw+20) this.alive=false; }
      draw() {
        gx.fillStyle = '#fff';
        gx.fillRect(this.x, this.y, this.w, this.h);
        gx.fillStyle = this.upg.color;
        gx.fillRect(this.x-1, this.y-1, this.w+2, this.h+2);
      }
    }

    class Enemy {
      constructor(type) {
        this.type=type||'basic'; this.x=gw+20;
        this.w=20; this.h=20; this.y=gh-54-3;
        this.speed=1+Math.random()*0.4; this.alive=true;
        this.hp=type==='boss'?15:type==='tough'?4:1;
        this.maxHp=this.hp; this.hitF=0; this.boss=type==='boss';
        this.emoji = this.boss ? '🦁' : this.type==='tough' ? '🐺' : '🦊';
        this.weirdScale = 0.8 + Math.random() * 0.4;
        if(this.boss){this.w=28;this.h=28;this.y=gh-54-8;this.speed=0.5;}
      }
      update() { this.x-=this.speed+(this.boss?0.1:0); if(this.hitF>0)this.hitF--; if(this.x<-40)this.alive=false; }
      draw() {
        const flash=this.hitF>0;
        const fontSize = flash ? (this.boss ? 26 : 18) : (this.boss ? 24 : this.type==='tough' ? 18 : 16);
        gx.font = fontSize+'px monospace';
        gx.textAlign = 'center';
        gx.textBaseline = 'bottom';
        if (flash) {
          gx.shadowBlur = 20;
          gx.shadowColor = '#fff';
        }
        gx.fillStyle = flash ? '#fff' : '#ddd';
        gx.fillText(this.emoji, this.x + this.w/2, this.y + this.h + 2);
        gx.shadowBlur = 0;
        // HP bar
        if(this.maxHp>1) {
          const barW = this.w + 4;
          gx.fillStyle='rgba(0,0,0,0.5)';
          gx.fillRect(this.x-2,this.y-7,barW,4);
          gx.fillStyle=this.boss?'#f00':'#ff8800';
          gx.fillRect(this.x-2,this.y-7,barW*(this.hp/this.maxHp),4);
        }
      }
      takeDamage() {
        this.hp--; this.hitF=6;
        if(this.hp<=0) {
          this.alive=false; game.killCount++;
          for(let i=0;i<(this.boss?25:8);i++) game.particles.push({x:this.x+this.w/2,y:this.y+this.h/2,dx:(Math.random()-0.5)*5,dy:(Math.random()-0.5)*5,life:20+Math.random()*15,color:COLORS[Math.floor(Math.random()*COLORS.length)],size:1.5+Math.random()*2.5});
          if(this.boss){playBossHit();game.screenShake=8;game.bossActive=false;}
          else playHit();
          if(this.boss||this.type==='tough') addCoins(this.boss?5:2);
        }
      }
    }

    function drawTerrain() {
      const t = getTerrain();
      const grad = gx.createLinearGradient(0,0,0,gh);
      grad.addColorStop(0,t.sky[0]); grad.addColorStop(0.7,t.sky[1]);
      gx.fillStyle=grad; gx.fillRect(0,0,gw,gh);
      // Clouds
      gx.fillStyle='rgba(255,255,255,0.08)';
      for(let i=0;i<3;i++){const cx=(i*200+game.scrollX*0.2*i)%(gw+80)-40;gx.fillRect(cx,15+i*20,30,8);gx.fillRect(cx+10,15+i*20-4,18,6);}
      // Stars for space
      if(t.id==='space'){gx.fillStyle='#fff';for(let i=0;i<25;i++){gx.fillRect((i*97+game.scrollX*0.05)%gw,(i*53)%(gh*0.5),1,1);}}
      // Mountains/bg
      gx.fillStyle='rgba(0,0,0,0.12)';
      for(let i=0;i<6;i++){const bx=(i*100+game.scrollX*0.3)%(gw+150)-75;const bh=30+Math.sin(i*2)*15;gx.beginPath();gx.moveTo(bx,gh-50);gx.lineTo(bx+25,gh-50-bh);gx.lineTo(bx+50,gh-50);gx.fill();}
      // Ground
      const gY=gh-50;
      gx.fillStyle=t.ground[0]; gx.fillRect(0,gY,gw,50);
      gx.fillStyle=t.ground[1]; gx.fillRect(0,gY,gw,3);
      gx.fillStyle='rgba(255,255,255,0.08)';
      for(let i=0;i<12;i++){const dx=(i*40+game.scrollX)%(gw+15)-7;gx.fillRect(dx,gY+5+Math.sin(i)*2,5,2);}
      // Label
      gx.fillStyle='rgba(255,255,255,0.15)'; gx.font='bold 7px monospace';
      gx.fillText(t.name+' #'+(Math.floor(totalCoins/500)+1),6,10);
      gx.fillStyle='rgba(255,255,255,0.1)'; gx.fillText('💀 '+game.killCount,gw-55,10);
      if(game.bossActive){
        gx.fillStyle='#f00'; gx.font='bold 8px monospace';
        gx.fillText('⚠ BOSS ⚠',gw/2-30,22);
        gx.strokeStyle=`rgba(255,0,0,${0.3+Math.sin(game.frame*0.1)*0.3})`; gx.lineWidth=2; gx.strokeRect(1,1,gw-2,gh-2);
      }
    }

    function updateGame() {
      game.frame++; game.scrollX -= 1.2;
      const ownedUpgs = UPGRADES.filter(u=>owned[u.id]);
      game.players = game.players.filter(p=>ownedUpgs.some(u=>u.id===p.upg.id));
      ownedUpgs.forEach((upg,i)=>{if(!game.players.some(p=>p.upg.id===upg.id))game.players.push(new GamePlayer(upg,i));});
      game.players.forEach((p,i)=>{p.x=16+i*28;p.update();});
      game.enemyTimer--;
      if(game.enemyTimer<=0){game.enemyTimer=Math.max(10,40-ownedUpgs.length*3)+Math.random()*20;game.enemies.push(new Enemy(Math.random()<0.15?'tough':'basic'));}
      if(!game.bossActive){game.bossTimer--;if(game.bossTimer<=0){game.bossTimer=800+Math.random()*500;game.enemies.push(new Enemy('boss'));game.bossActive=true;}}
      if(game.bossTimer<=0&&!game.bossActive)game.bossTimer=800+Math.random()*500;
      game.enemies.forEach(e=>e.update()); game.enemies=game.enemies.filter(e=>e.alive);
      game.projectiles.forEach(p=>{p.update();game.enemies.forEach(e=>{if(e.alive&&p.alive&&p.x<e.x+e.w&&p.x+p.w>e.x&&p.y<e.y+e.h&&p.y+p.h>e.y){p.alive=false;e.takeDamage();}});});
      game.projectiles=game.projectiles.filter(p=>p.alive);
      game.enemies=game.enemies.filter(e=>e.alive);
      game.particles.forEach(p=>{p.x+=p.dx;p.y+=p.dy;p.dy+=0.1;p.life--;}); game.particles=game.particles.filter(p=>p.life>0);
      if(game.screenShake>0)game.screenShake-=0.5;
    }

    function drawGame() {
      gx.save();
      if(game.screenShake>0)gx.translate((Math.random()-0.5)*game.screenShake*2,(Math.random()-0.5)*game.screenShake*2);
      drawTerrain();
      game.enemies.forEach(e=>e.draw());
      game.players.forEach(p=>p.draw());
      game.projectiles.forEach(p=>p.draw());
      game.particles.forEach(p=>{gx.fillStyle=p.color;gx.globalAlpha=p.life/30;gx.fillRect(p.x,p.y,p.size,p.size);});
      gx.globalAlpha=1;
      gx.restore();
    }

    function gameLoop() { updateGame(); drawGame(); requestAnimationFrame(gameLoop); }

    // ═══════════════════════════════════════════════════════════════════════════
    // INIT
    // ═══════════════════════════════════════════════════════════════════════════
    renderShop();
    updateUI();
    gameLoop();
  </script>
</body>
</html>
